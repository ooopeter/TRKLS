function clearCell(cx,cy){for(let y=0;y<10;y++)for(let x=0;x<8;x++)pset(cx*8+x,cy*10+y,0);}
function cls(){pix.fill(0);tx=ty=0;graph=false;dirty=true;}
function fk(x,y){tx=x;ty=y;}
function adv(){tx++;if(tx>=COLS){tx=0;ty++;}if(ty>23)ty=23;}
const PSEUDO={ // 8x10 cell bitmaps for the pseudographics the program uses
  0xB5:c=>{for(let x=0;x<8;x++)c(x,5);},
  0xB7:c=>{for(let y=0;y<10;y++)c(3,y);},
  0xAA:c=>{for(let x=3;x<8;x++)c(x,5);for(let y=5;y<10;y++)c(3,y);},
  0xA3:c=>{for(let x=0;x<4;x++)c(x,5);for(let y=5;y<10;y++)c(3,y);},
  0xA6:c=>{for(let x=3;x<8;x++)c(x,5);for(let y=0;y<6;y++)c(3,y);},
  0xB9:c=>{for(let x=0;x<4;x++)c(x,5);for(let y=0;y<6;y++)c(3,y);},
  0xBF:c=>{for(let y=0;y<10;y++)for(let x=0;x<8;x++)c(x,y);},
  0xB1:c=>{for(let x=1;x<7;x++)c(x,5);for(let i=1;i<4;i++){c(1+i,5-i);c(1+i,5+i);}},
  0xBE:c=>{for(let x=1;x<7;x++)c(x,5);for(let i=1;i<4;i++){c(6-i,5-i);c(6-i,5+i);}},
  0xB3:c=>{for(let y=2;y<9;y++)c(3,y);for(let i=1;i<4;i++){c(3-i,2+i);c(3+i,2+i);}},
  0xAD:c=>{for(let y=1;y<8;y++)c(3,y);for(let i=1;i<4;i++){c(3-i,8-i);c(3+i,8-i);}},
};
function putChar(ch){
  const code=ch.charCodeAt(0);
  clearCell(tx,ty);
  const ox=tx*8,oy=ty*10;
  if(PSEUDO[code])PSEUDO[code]((x,y)=>pset(ox+x,oy+y,ink));
  else if(ch!==" "){const g=FONT[ch]||FONT[ch.toUpperCase()];
    if(g)for(let y=0;y<8;y++)for(let x=0;x<8;x++)if(g[y]&(128>>x))pset(ox+x,oy+1+y,ink);}
  adv();
}
let beepOn=true,actx=null;
function beep(f=880,d=.06){if(!beepOn)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  const o=actx.createOscillator(),g=actx.createGain();o.type="square";o.frequency.value=f;g.gain.value=.05;
  o.connect(g);g.connect(actx.destination);const t=actx.currentTime;o.start(t);g.gain.setValueAtTime(.05,t+d-.01);g.gain.linearRampToValueAtTime(0,t+d);o.stop(t+d);}catch(e){}}
function out(str){
  for(const ch of str){const c=ch.charCodeAt(0);
    if(c===0x95){graph=!graph;pen=0;if(graph){gx=tx*8;gy=ty*10+1;}continue;}
    if(c===0x96){pen=1;if(graph)pset(gx,gy,ink);continue;}
    if(c===0x97){pen=2;if(graph)pset(gx,gy,0);continue;}
    if(c>=0x91&&c<=0x94){ink=c-0x90;continue;}
    if(c===0x9D){inverted=!inverted;dirty=true;continue;}
    if(c===0x0C){cls();continue;}
    if(c===0x07){beep();continue;}
    if(MOVES[c]){const[dx,dy]=MOVES[c];
      if(graph){gx+=dx;gy+=dy;if(pen===1)pset(gx,gy,ink);else if(pen===2)pset(gx,gy,0);}
      else{tx+=dx;ty+=dy;if(tx<0){tx=COLS-1;ty--;}if(tx>=COLS){tx=0;ty++;}ty=Math.max(0,Math.min(23,ty));}
      continue;}
    if(c===0x0A){tx=0;ty=Math.min(23,ty+1);continue;}
    if(c===0x18){c18();continue;}
    if(c>=0x80&&c<0xA0)continue;          // other mode codes (cursor, 32/64, indicators)
    if(graph)continue;
    putChar(ch);
  }
}
function c18(){putChar(" ");}
const nl=()=>out("\n");

/* ---------- rendering ---------- */
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
const off=document.createElement("canvas");off.width=W;off.height=H;const octx=off.getContext("2d");const img=octx.createImageData(W,H);
function frame(){if(dirty){dirty=false;const P=inverted?PAL_I:PAL_N;const d=img.data;
  for(let i=0;i<W*H;i++){const p=P[pix[i]];d[i*4]=p[0];d[i*4+1]=p[1];d[i*4+2]=p[2];d[i*4+3]=255;}
  octx.putImageData(img,0,0);ctx.imageSmoothingEnabled=false;ctx.drawImage(off,0,0,1024,720);}
  requestAnimationFrame(frame);}
requestAnimationFrame(frame);

/* ---------- input ---------- */
let queue=[],waiter=null,gen=0;
function push(k){if(waiter){const w=waiter;waiter=null;w(k);}else{queue.push(k);if(queue.length>4)queue.shift();}}
class Abort{}
function key(){const g=gen;return new Promise((res,rej)=>{if(queue.length)return res(queue.shift());waiter=k=>g===gen?res(k):rej(new Abort);});}
const sleep=ms=>{const g=gen;return new Promise((res,rej)=>setTimeout(()=>g===gen?res():rej(new Abort),ms));};
const KEYMAP={ArrowLeft:8,ArrowRight:25,ArrowUp:26,ArrowDown:27,a:8,d:25,w:26,s:27,A:8,D:25,W:26,S:27,h:8,l:25,k:26,j:27};
addEventListener("keydown",e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;
  let k=KEYMAP[e.key];if(k===undefined){if(e.key.length===1)k=e.key.charCodeAt(0);else if(e.key==="Enter")k=13;else return;}
  if(e.target.tagName==="BUTTON"&&(e.key===" "||e.key==="Enter"))return;
  e.preventDefault();push(k);});
document.getElementById("screen").addEventListener("click",()=>push(32));
document.querySelectorAll("[data-k]").forEach(b=>b.addEventListener("click",e=>{push(+b.dataset.k);b.blur();}));

/* ---------- language ---------- */
let EN=false;try{EN=localStorage.getItem("wampir-lang")==="en";}catch(e){}
const T=(ru,en)=>EN?en:ru;
const statusEl=document.getElementById("status");
const status=(ru,en)=>{statusEl.textContent=T(ru,en);};
function applyLang(){
  document.getElementById("lang").textContent=EN?"Русский":"English";
  document.getElementById("restart").textContent=T("Заново","Restart");
  document.getElementById("snd").textContent=beepOn?T("Звук вкл","Sound on"):T("Звук выкл","Sound off");
  document.getElementById("meta").textContent=T("А. Ю. Кузьмин · Рига 1986 · ФОКАЛ","A. Yu. Kuzmin · Riga 1986 · FOCAL");
  document.getElementById("keys").innerHTML=T(
    "<kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> ход · любая другая клавиша — стоять · <kbd>1</kbd>–<kbd>5</kbd> вампиров",
    "<kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> move · any other key: stay · <kbd>1</kbd>–<kbd>5</kbd> vampires");
  document.getElementById("notes").innerHTML=T(
    "<p>Вы ходите на одну клетку; затем каждый вампир шагает к вам, в том числе по диагонали. Если камень мешает вампиру, он пытается шагнуть наугад.</p><p>Толкайте камни (целым рядом, если нужно), чтобы замуровать вампиров. Вампир пойман, когда все восемь соседних клеток — камни или край поля. Победа, когда пойманы все.</p>",
    "<p>You move one square; then every vampire steps toward you, diagonals included. If a stone blocks a vampire, it tries a random diagonal step instead.</p><p>Push stones (a whole row at once if needed) to wall the vampires in. A vampire is caught when all eight squares around it are stones or the edge of the field. You win when they are all caught.</p>");
}
document.getElementById("lang").addEventListener("click",e=>{EN=!EN;try{localStorage.setItem("wampir-lang",EN?"en":"ru");}catch(_){}applyLang();e.currentTarget.blur();restart();});
document.getElementById("snd").addEventListener("click",e=>{beepOn=!beepOn;e.currentTarget.setAttribute("aria-pressed",beepOn);applyLang();e.currentTarget.blur();});
document.getElementById("restart").addEventListener("click",e=>{e.currentTarget.blur();restart();});

/* ---------- the program (port of WAMPIR.FOC) ---------- */
const rnd=n=>Math.floor(Math.random()*n+1);        // FITR(FABS(FRAN())*n+1)
const rsgn=()=>Math.random()<.5?-1:1;               // FSGN(FRAN())
const G={vamp:S("20.91"),wipe:S("20.92"),hero:S("10.78"),arms:S("10.77"),stone:S("90.20"),
  wipeHero:S("10.75"),wipeHero2:S("50.02"),key:(s=>s.slice(2,s.lastIndexOf("\x95")+1))(S("92.19"))};
async function fx(codes){for(const c of codes){out(String.fromCharCode(c));if(c===0x9D)await sleep(45);else if(c===7)await sleep(70);}}

async function title(){                                          // 01.04 – 04.99
  inverted=false;out("\x0C\x94\x91");
  fk(10,1);out(T(S("02.01"),"A.YU.KUZMIN"));
  fk(11,22);out(T(S("02.05"),"RIGA 1986"));
  fk(0,6);for(const k of["02.07","02.08","02.09","02.10","02.11","02.12","02.13","02.15"])out(S(k));
  fk(14,16);out(S("95.01")+S("95.07"));
  fk(14,17);out(S("95.02")+S("95.04")+S("95.10")+S("95.08"));
  fk(14,18);out(S("95.03")+S("95.06")+S("95.09"));
  fk(15,19);out(S("95.05")+S("95.11"));
  status("Нажмите любую клавишу","Press any key");
  await key();
}
async function rules(){                                          // 05.02, 92.xx
  out("\x0C\x92\x9D\x94");
  let n;
  if(!EN){
    fk(8,2);out(S("92.05"));fk(8,3);out(S("92.05",1));
    nl();nl();out(S("92.10"));nl();out(S("92.12"));
    fk(5,10);out(G.hero+S("92.13")+G.vamp+S("92.13",1));
    fk(0,12);out(S("92.15"));fk(0,13);out(S("92.16"));fk(0,14);out(S("92.17"));fk(0,15);out(S("92.18"));
    fk(0,16);out(S("92.19"));
    fk(0,18);out(S("92.20")+G.stone+S("92.20",1));out(S("92.21"));
  }else{
    fk(7,2);out("RULES OF THE GAME:");fk(7,3);out("\xB5".repeat(18));
    fk(0,5);out("'VAMPIRE' IS A SURVIVAL GAME.");
    fk(0,6);out(" YOUR GOAL: ESCAPE FROM THE");
    fk(0,7);out("VAMPIRES WHO WILL HUNT YOU DOWN.");
    fk(5,10);out(G.hero+" - YOU      "+G.vamp+" - VAMPIRE");
    fk(0,12);out("  \xB1  LEFT");fk(0,13);out("  \xB3  UP");fk(0,14);out("  \xBE  RIGHT");fk(0,15);out("  \xAD  DOWN");
    fk(0,16);out("  "+G.key+"\x19  ANY OTHER KEY - STAY");
    fk(0,18);out(" YOU CAN PUSH STONES "+G.stone+" AND");
    fk(0,19);out(" MUST WALL IN EVERY VAMPIRE.");
  }
  document.getElementById("digits").classList.add("on");
  status("Сколько вампиров? Нажмите 1–5","How many vampires? Press 1–5");
  for(;;){                                                       // 92.50 – 92.55
    fk(0,21);out(T(S("92.50"),"NUMBER OF VAMPIRES (1-5)"));out(":");
    const k=await key();
    if(k>=49&&k<=53){n=k-48;out(String(n));await sleep(250);break;}
    beep(220,.08);
  }
  document.getElementById("digits").classList.remove("on");
  out("\x0C");
  return n;
}
async function game(N){
  const M=Array.from({length:32},()=>new Array(22).fill(0));
  const K=[],L=[];
  status("","");
  out(S("05.04"));                                               // border
  for(let i=1;i<=20;i++){fk(0,i);out("\xB7");fk(31,i);out("\xB7");}
  out(S("05.08"));
  for(let i=1;i<=20;i++)for(let j=1;j<=8;j++){const x=rnd(29);M[x][i]=1;fk(x,i);out(G.stone);}   // 05.20 stones
  let X=rnd(29),Y=rnd(19);                                       // 05.25
  fk(X,Y);out(" ");fk(X,Y);out(G.hero);
  for(let i=1;i<=N;i++){do K[i]=rnd(29);while(Math.abs(K[i]-X)<=5);L[i]=rnd(19);   // group 91
    fk(K[i],L[i]);out(" ");fk(K[i],L[i]);out(G.vamp);await sleep(60);}
  for(let i=1;i<=N;i++)M[K[i]][L[i]]=3;                          // 10.01
  M[X][Y]=2;
  for(;;){
    const X1=X,Y1=Y;let Z1=0,Z2=0;                               // 10.10
    fk(10,22);out(T(S("10.15"),"YOUR MOVE"));
    status("Ваш ход","Your move");
    const k=await key();
    fk(10,22);out(" ".repeat(9));
    if(k===8)Z1=-1;else if(k===25)Z1=1;else if(k===26)Z2=-1;else if(k===27)Z2=1;
    X+=Z1;Y+=Z2;                                                 // 10.50
    if(X===0||X===31)X=X1;
    if(Y===0||Y===21)Y=Y1;
    if(M[X][Y]===1){                                             // 40.xx push stones
      if(X+Z1===0||X+Z1===31)X=X1;
      if(Y+Z2===0||Y+Z2===21)Y=Y1;
      if(M[X][Y+Z2]===3)Y=Y1;
      if(M[X+Z1][Y]===3)X=X1;
      let t=1;
      if(Z1!==0){
        for(;;){const u=X+Z1*t;
          if(u===0||u===31){X=X1;break;}
          if(M[u][Y]===0){t++;break;}
          if(M[u][Y]===3){X=X1;break;}
          t++;}
        for(let r=0;r<t;r++){const u=X+Z1*r;M[u][Y]=1;fk(u,Y);out(G.stone);}
      }else{
        for(;;){const u=Y+Z2*t;
          if(u===0||u===21){Y=Y1;break;}
          if(M[X][u]===0){t++;break;}
          if(M[X][u]===3){Y=Y1;break;}
          t++;}
        for(let r=0;r<t;r++){const u=Y+Z2*r;M[X][u]=1;fk(X,u);out(G.stone);}
      }
    }else if(M[X][Y]===3){return lose(X,Y,X1,Y1,X,Y);}         // 10.72
    M[X1][Y1]=0;M[X][Y]=2;                                       // 10.74
    fk(X1,Y1);out(G.wipeHero);
    fk(X,Y);out(" ");fk(X,Y);out(G.hero);
    let N2=0;                                                    // 10.80
    status("Ход вампиров","Vampires move");
    for(let n1=1;n1<=N;n1++){                                    // 20.xx
      const K1=K[n1],L1=L[n1];let K2=K1,L2=L1,P=0;
      K2+=Math.sign(X-K1);L2+=Math.sign(Y-L1);
      move:for(;;){
        if(K2===0||K2===31)K2=K1;
        if(L2===0||L2===21)L2=L1;
        if(M[K2][L2]===2)return lose(X,Y,X,Y,K1,L1);            // 20.35
        if(M[K2][L2]!==1)break move;                             // 20.37
        K2=K1;L2=L1;                                             // 20.39 → 30.05
        let trapped=true;
        for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){
          if(!dx&&!dy)continue;const a=K2+dx,b=L2+dy;
          if(a<1||a>30||b<1||b>20)continue;
          if(M[a][b]!==1)trapped=false;}
        if(trapped){N2++;if(N2>=N)return win();break move;}
        if(P===2)break move;                                     // 20.42
        K2=K1+rsgn();L2=L1+rsgn();P++;                           // 20.46
      }
      M[K1][L1]=0;K[n1]=K2;L[n1]=L2;M[K2][L2]=3;                 // 20.60
      fk(K1,L1);out(G.wipe);fk(K2,L2);out(G.wipe);fk(K2,L2);out(G.vamp);
      await sleep(110);
    }
  }
}
async function lose(X,Y,X1,Y1,K1,L1){                            // 50.xx
  status("Вас съели","You were eaten");
  fk(X1,Y1);out(G.wipeHero2);
  for(let i=0;i<=5;i++)await fx([7,145,157,146,157,148]);
  for(let i=0;i<=9;i++){fk(X,Y);out(G.arms);beep();await sleep(120);fk(X,Y);out(" ");await sleep(80);}
  if(K1!==X||L1!==Y){fk(K1,L1);out(G.wipe);}
  fk(X,Y);out(G.wipe);fk(X,Y);out(G.vamp);
  fk(X+1,Y);out(S("50.15"));
  await fx([7,7,7,7,7,7]);
  status("Нажмите любую клавишу дважды","Press any key twice");
  await key();await key();
  out("\x9D\x91");
}
async function win(){                                            // 30.xx
  status("Победа!","You won!");
  await fx([7,7,7,7,7,7]);
  for(let i=0;i<=4;i++)await fx([147,157,157]);
  out("\x94");
  fk(0,22);out(T(S("30.50"),"HOORAY!! ALL VAMPIRES TRAPPED!"));
  status("Нажмите любую клавишу дважды","Press any key twice");
  await key();await key();
  out("\x9D\x9A");
}
async function main(){
  for(;;){
    try{await title();const n=await rules();await game(n);}
    catch(e){if(!(e instanceof Abort))throw e;return;}
  }
}
function restart(){gen++;queue=[];if(waiter){const w=waiter;waiter=null;w(-1);}
  document.getElementById("digits").classList.remove("on");setTimeout(main,0);}
applyLang();main();
</script>
